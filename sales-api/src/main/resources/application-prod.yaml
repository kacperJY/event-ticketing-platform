spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

  rabbitmq:
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    port: ${RABBITMQ_NODE_PORT}
    host: ${RABBITMQ_HOST}

jwt-secret-key: ${JWT_SECRET_KEY}

server:
  port: ${SERVER_PORT}
