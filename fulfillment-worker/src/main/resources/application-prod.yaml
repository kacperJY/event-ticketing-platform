spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false

  rabbitmq:
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    port: ${RABBITMQ_NODE_PORT}
    host: ${RABBITMQ_HOST}

  mail:
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    port: ${SMTP_PORT}
    host: ${SMTP_HOST}

mail-config:
  from: ${MAIL_FROM}

order-completion:
  pdf-files-path: /opt/ticketing/pdfs/