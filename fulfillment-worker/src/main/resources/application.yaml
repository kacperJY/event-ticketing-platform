spring:
  application:
    name: fulfillment-worker

  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: ${database.batch-size}
  threads:
    virtual:
      enabled: true

  flyway:
    locations: classpath:db/migration
    enabled: true

  rabbitmq:
    listener:
      simple:
        prefetch: 30

  mail:
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

database:
  batch-size: 50

order-completion:
  concurrent: 10
  fetch-size: 4
  max-retries: 5
  delay: 20
  pdf-files-path: ${user.home}/ticketing/pdfs/


rabbitmq:
  consumer:
    max-retries: 3
    max-delay: 12
    multiplier: 2.0
    delay: 3
  sales-api:
    completed-order:
      queue-name: "event-ticketing-platform.sales-api.completed-order.queue"
      routing-key: "event-ticketing-platform.sales-api.completed-order.routing-key"
  fulfillment-worker:
    completed-order:
      consumer-name: "completed-order-service-consumer"
      dlq: "event-ticketing-platform.fulfillment-worker.completed-order.dlq"
      dlq-routing-key: "event-ticketing-platform.fulfillment-worker.completed-order.dlq-routing-key"

  exchange:
    dead-letter-exchange: "event-ticketing-platform.dead-letter-exchange"
    main-exchange: "event-ticketing-platform.main-exchange"

message-integration:
  sales-api:
    contract:
      completed-order:
        aggregate-type: "ORDER"
        operation-type: "PAID"
        message-payload-version: "V1"
    headers:
      aggregate-id: "aggregateId"
      operation-type: "operationType"
      message-payload-version: "payloadVersion"
      aggregate-type: "aggregateType"
