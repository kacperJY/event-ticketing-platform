spring:
  application:
    name: fulfillment-worker

  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: ${database.batch-size}
  threads:
    virtual:
      enabled: true

  flyway:
    locations: classpath:db/migration
    enabled: true

  rabbitmq:
    listener:
      simple:
        prefetch: 250

database:
  batch-size: 50

sales-api:
  rabbitmq:
    order-completed:
      queue-name: "event-ticketing-platform.sales-api.completed-order.queue"
