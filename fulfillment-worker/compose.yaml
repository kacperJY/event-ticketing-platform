services:
  event-ticketing-platform-fulfillment-worker-db:
    image: postgres:17.10
    container_name: "event-ticketing-platform-fulfillment-worker-db"
    environment:
      - "POSTGRES_DB"
      - "POSTGRES_USER"
      - "POSTGRES_PASSWORD"
    volumes:
      - event-ticketing-platform-fulfillment-worker-db-volume:/var/lib/postgresql/data
    networks:
      - worker-network
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: [ "prod","dev" ]


volumes:
  event-ticketing-platform-fulfillment-worker-db-volume:
networks:
  worker-network: