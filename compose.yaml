services:
  event-ticketing-platform-db:
    image: postgres:17.10
    container_name: "event-ticketing-platform-db"
    environment:
      - "POSTGRES_DB"
      - "POSTGRES_USER"
      - "POSTGRES_PASSWORD"
    volumes:
       - event-ticketing-platform-db-volume:/var/lib/postgresql/data
    networks:
      - main-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: ["prod","dev"]
  event-ticketing-platform-message-broker:
    image: rabbitmq:4.3.2-management
    container_name: "event-ticketing-platform-message-broker"
    ports:
      - "${RABBITMQ_MANAGEMENT_TCP_PORT}:${RABBITMQ_MANAGEMENT_TCP_PORT}"
      - "${RABBITMQ_NODE_PORT}:${RABBITMQ_NODE_PORT}"
    environment:
      - "RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}"
      - "RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}"
      - "RABBITMQ_CONFIG_FILE=${RABBITMQ_CONFIG_FILE}"
    volumes:
      - ./rabbitmq:/config/rabbitmq
      - event-ticketing-platform-message-broker-volume:/var/lib/rabbitmq
    networks:
      - main-network
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity" ]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: ["prod","dev"]
  event-ticketing-platform-sales-api:
    build: ./sales-api
    image: kacperjn/sales-api
    container_name: "event-ticketing-platform-sales-api"
    pull_policy: build
    networks:
      - main-network
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - "SERVER_PORT"
      - "SPRING_PROFILES_ACTIVE=prod"
      - "DB_URL"
      - "DB_USER"
      - "DB_PASSWORD"
      - "RABBITMQ_HOST"
      - "RABBITMQ_NODE_PORT"
      - "RABBITMQ_DEFAULT_USER"
      - "RABBITMQ_DEFAULT_PASS"
      - "JWT_SECRET_KEY"
      - "STRIPE_SECRET_KEY"
    depends_on:
      event-ticketing-platform-db:
        condition: service_healthy
      event-ticketing-platform-message-broker:
        condition: service_healthy
    profiles: ["prod"]
volumes:
  event-ticketing-platform-db-volume:
  event-ticketing-platform-message-broker-volume:
networks:
  main-network:
